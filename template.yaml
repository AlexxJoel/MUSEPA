AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  museepa

  Sample SAM Template for museepa


Globals:
  Function:
    Timeout: 25
    MemorySize: 128
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE'"
      AllowHeaders: "'*'"
      AllowOrigin: "'*'"
Parameters:
  PostgresHost:
    Type: String
    Description: "The host of the Postgres database"
  PostgresPassword:
    Type: String
    Description: "The password for the Postgres database"
  PostgresDatabase:
    Type: String
    Description: "The name of the Postgres database"
  UserPoolId:
    Type: String
    Description: "The ID of the Cognito User Pool"
  ClientId:
    Type: String
    Description: "The Client ID for Cognito"
  RegionName:
    Type: String
    Description: "The AWS region"
  AwsAccessKeyId:
    Type: String
    Description: "The AWS Access Key ID"
  AwsSecretAccessKey:
    Type: String
    Description: "The AWS Secret Access Key"
  BucketName:
    Type: String
    Description: "The S3 bucket name"
Resources:

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:*:*:*'
        - PolicyName: get-secrets-db-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:prod/musepa-*'
        - PolicyName: manage-cognito-users-pool-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminAddUserToGroup
                  - cognito-idp:RespondToAuthChallenge
                  - cognito-idp:AdminInitiateAuth
                  - cognito-idp:InitiateAuth
                  - cognito-idp:AdminListGroupsForUser
                  - cognito-idp:AdminUpdateUserAttributes
                  - cognito-idp:AdminDeleteUser
                  - cognito-idp:AdminSetUserPassword
                Resource: '*'
        - PolicyName: s3-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub 'arn:aws:s3:::${MusepaBucket}/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::${MusepaBucket}'
  # ----------------------------------------------
  # Configuring Cognito
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: museepa-users
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
  # Groups for Cognito
  ManagerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: manager
      UserPoolId: !Ref UserPool
      Description: "Manager Group"
      Precedence: 1
  VisitorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: visitor
      UserPoolId: !Ref UserPool
      Description: "Visitor Group"
      Precedence: 2
  # Cognito App Client
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: museepa
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
        - implicit
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      CallbackURLs:
        - 'https://${AuthApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/callback'
      LogoutURLs:
        - 'https://${AuthApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/logout'
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
  # Cognito configuration --> Api Authorization --> Function Authorization
  # ----------------------------------------------
  # Configuration s3 bucket
  MusepaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: musepa-bucket-v2
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
              - HEAD
            AllowedOrigins:
              - "*"
            ExposedHeaders:
                - "ETag"
  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MusepaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action: 's3:*'
            Principal: '*'
            Effect: Allow
            Resource: !Sub 'arn:aws:s3:::${MusepaBucket}/*'
# ----------------------------------------------
# SEcrets
  DataSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: prod/musepa
      Description: "Secrets for musepa"
      SecretString: !Sub |
        {
          "POSTGRES_HOST": "${PostgresHost}",
          "POSTGRES_PASSWORD": "${PostgresPassword}",
          "POSTGRES_DATABASE": "${PostgresDatabase}",
          "USER_POOL_ID": "${UserPoolId}",
          "CLIENT_ID": "${ClientId}",
          "REGION_NAME": "${RegionName}",
          "AWS_ACCESS_KEY_ID": "${AwsAccessKeyId}",
          "AWS_SECRET_ACCESS_KEY": "${AwsSecretAccessKey}",
          "BUCKET_NAME": "${BucketName}"
        }
      Tags:
        - Key: Name
          Value: !Sub "MySecrets-${AWS::StackName}"
    # ----------------------------------------------
#  cloudwatch logs
  MuseepaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-logs"
      RetentionInDays: 14


  # API Gateway
  EventApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: EventApi
      StageName: Dev
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
            IdentitySource: method.request.header.Authorization
  MuseumApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: MuseumApi
      StageName: Dev
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
            IdentitySource: method.request.header.Authorization
  WorkApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: WorkApi
      StageName: Dev
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
            IdentitySource: method.request.header.Authorization
  VisitorApi:
