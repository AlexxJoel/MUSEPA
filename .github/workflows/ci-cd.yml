name: CI/CD MUSEEPA

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage
          pip install -r tests/unit/requirements.txt

      - name: Run tests with coverage
        run: |
          coverage run -m unittest discover -v -s tests/unit
          coverage xml -o coverage-reports/coverage-python.xml
          coverage report -m

      - name: Store coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage-reports/coverage-python.xml

  sonarcloud:
      needs: test
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3
          with:
            fetch-depth: 0
        - name: Download coverage report
          uses: actions/download-artifact@v3
          with:
            name: coverage-report
            path: coverage-reports
        - name: SonarCloud Scan
          uses: SonarSource/sonarcloud-github-action@master
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          with:
            args: >
              -Dsonar.python.coverage.reportPaths=coverage-reports/coverage-python.xml
              -X


  deploy:
    if: github.ref == 'refs/heads/master'
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: sonarcloud
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Clear pip cache
        run: pip cache purge

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1

      - name: Install system dependencies
        run: sudo apt-get install -y libpq-dev

      - name: Install Python dependencies for all modules
        run: |
          for dir in modules/**/; do
            if [ -f "${dir}/requirements.txt" ]; then
              pip install -r "${dir}/requirements.txt"
            fi
          done

      - name: Install SAM CLI
        run: pip install aws-sam-cli

      - name: Build SAM application with Debugging
        run: sam build --use-container --debug

      - name: Echo parameters (for debugging)
        run: |
          echo "PostgresHost=${{ secrets.POSTGRES_HOST }}"
          echo "PostgresDatabase=${{ secrets.POSTGRES_DATABASE }}"
          echo "UserPoolId=${{ secrets.USER_POOL_ID }}"

      - name: Deploy SAM application
        run: | 
          sam deploy \
            --stack-name museepa \
            --region ${{ secrets.REGION_NAME }} \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --config-env GitHubActions \
            --parameter-overrides \
              PostgresHost=${{ secrets.POSTGRES_HOST }} \
              PostgresPassword=${{ secrets.POSTGRES_PASSWORD }} \
              PostgresDatabase=${{ secrets.POSTGRES_DATABASE }} \
              UserPoolId=${{ secrets.USER_POOL_ID }} \
              ClientId=${{ secrets.CLIENT_ID }} \
              RegionName=${{ secrets.REGION_NAME }} \
              AwsAccessKeyId=${{ secrets.AWS_ACCESS_KEY_ID }} \
              AwsSecretAccessKey=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              BucketName=${{ secrets.BUCKET_NAME }}

      - name: Cache pip dependencies
        uses: actions/cache@v2
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
